  <noscript><article class="seo-fallback"><h1>Pulse</h1><p>A speculative film about AI, ethics and identity.</p><p>Set in a fictional future scenario, PULSE delves into the profound implications of artificial intelligence on society, ethics and human identity. This artistic work, created by students of LMU Munich, reflects on the evolving relationship between humanity and technology.</p><p>Produced as part of an academic seminar, PULSE was first showcased during the 4th International Technical University of Kenya, Exploring Visual Cultures Conference of Artificial Intelligence.</p><p>A compelling exploration of themes like AI ethics, futurism and the human condition, this project bridges art and technology, inviting critical reflection on the impact of artificial intelligence in a rapidly changing world.</p><dl><dt>Year</dt><dd>2024</dd><dt>Format</dt><dd>Short Film</dd><dt>Context</dt><dd>Seminar, LMU Munich</dd><dt>Role</dt><dd>Cinematography, co-direction, screenplay, acting, edit, sound design</dd><dt>Award</dt><dd>Shown at the 4th Int. TU Kenya Conference on AI</dd></dl><p><a href="/">Amy Grindau, Portfolio</a></p><ul><li><a href="/work/smartscan/">SmartScan</a></li><li><a href="/work/treasurechest/">AI Treasure Chest</a></li><li><a href="/work/brewinsight/">Brewinsight</a></li><li><a href="/work/nexus/">Nexus</a></li><li><a href="/work/theoneiwant/">The One I Want</a></li><li><a href="/work/snu80/">SNU 80th</a></li><li><a href="/work/sixthman/">6th Man</a></li><li><a href="/work/florilegium/">Florilegium</a></li><li><a href="/work/untitled/">Untitled</a></li><li><a href="/work/graphic/">Graphic Projects</a></li><li><a href="/work/printedmatter/">Printed Matter</a></li><li><a href="/work/ella/">Ella</a></li></ul></article></noscript>
